<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f59e0b">
  <title>Case File - Mystery X</title>
  <style>
    :root {
      --color-primary: #f59e0b;
      --color-primary-light: #fbbf24;
      --color-secondary: #a78bfa;
      --color-success: #34d399;
      --color-bg: #17162b;
      --color-bg-light: #221f3d;
      --color-panel: #2b2750;
      --color-text: #f5f3ff;
      --color-text-dim: #a5a0c9;
      --font-main: 'Nunito', 'Segoe UI', system-ui, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-main);
      background: linear-gradient(160deg, var(--color-bg) 0%, #241a3a 100%);
      min-height: 100vh; color: var(--color-text); padding: 20px;
    }
    .wrap { max-width: 560px; margin: 0 auto; }
    a.back { color: var(--color-text-dim); text-decoration: none; font-weight: 700; }
    a.back:hover { color: var(--color-primary-light); }
    h1 {
      font-size: 2.2rem; margin: 12px 0 4px;
      background: linear-gradient(90deg, var(--color-primary-light), var(--color-secondary));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .sub { color: var(--color-text-dim); margin-bottom: 22px; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 22px; }
    .stat { background: var(--color-bg-light); border: 2px solid var(--color-panel); border-radius: 16px; padding: 14px; text-align: center; }
    .stat .value { font-size: 1.9rem; font-weight: 800; color: var(--color-primary-light); font-variant-numeric: tabular-nums; }
    .stat .label { font-size: .8rem; color: var(--color-text-dim); text-transform: uppercase; letter-spacing: .08em; margin-top: 2px; }
    h2 { font-size: 1rem; text-transform: uppercase; letter-spacing: .1em; color: var(--color-text-dim); margin: 22px 0 10px; }
    .bar { background: var(--color-panel); border-radius: 999px; height: 26px; overflow: hidden; }
    .bar-fill {
      height: 100%; width: 0%; border-radius: 999px; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(90deg, var(--color-primary), var(--color-success));
      color: #2a1a04; font-weight: 800; font-size: .85rem; transition: width .6s ease;
    }
    .hint { color: var(--color-text-dim); font-size: .82rem; margin-top: 6px; line-height: 1.5; }
    .badges { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .badge { background: var(--color-bg-light); border: 2px solid var(--color-panel); border-radius: 14px; padding: 12px; display: flex; gap: 10px; align-items: flex-start; }
    .badge.locked { opacity: .4; }
    .badge .icon { font-size: 1.5rem; }
    .badge .name { font-weight: 800; font-size: .92rem; }
    .badge .desc { color: var(--color-text-dim); font-size: .78rem; line-height: 1.35; }
    .empty { color: var(--color-text-dim); text-align: center; grid-column: span 2; padding: 14px; }
    .levels { display: flex; flex-direction: column; gap: 8px; }
    .level { display: flex; justify-content: space-between; background: var(--color-bg-light); border-radius: 12px; padding: 10px 14px; font-size: .92rem; }
    .level .n { color: var(--color-primary-light); font-weight: 800; font-variant-numeric: tabular-nums; }
    @media (max-width: 420px) { .grid, .badges { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/mysteryx/">← Mystery X</a>
    <h1>Case File</h1>
    <p class="sub">Everything Layla has solved</p>

    <div class="grid">
      <div class="stat"><div class="value" id="solved">0</div><div class="label">Mysteries solved</div></div>
      <div class="stat"><div class="value" id="high-score">0</div><div class="label">High score</div></div>
      <div class="stat"><div class="value" id="best-streak">0</div><div class="label">Best streak</div></div>
      <div class="stat"><div class="value" id="perfect">0</div><div class="label">No-mistake solves</div></div>
    </div>

    <h2>Move accuracy</h2>
    <div class="bar"><div class="bar-fill" id="accuracy-fill">0%</div></div>
    <p class="hint">How often Layla picks the move that frees x, rather than one that just keeps the scale balanced.</p>

    <h2>Cases by level</h2>
    <div class="levels" id="levels"></div>

    <h2>Badges</h2>
    <div class="badges" id="badges"></div>
  </div>

  <script>
    const STORAGE_KEY = 'mysteryx-layla-stats';

    const BADGE_ICONS = {
      'first-x': '🔍', 'first-win': '📁', 'streak-5': '🔥', 'streak-10': '⚡',
      'flawless': '💎', 'two-step': '⚖️', 'mastermind': '🧠',
      'solved-25': '🏅', 'solved-100': '🏆', 'score-500': '🌟'
    };

    const ALL_BADGES = [
      ['first-x', 'Found X!', 'Free the mystery number for the first time'],
      ['first-win', 'Case Closed', 'Finish your first case'],
      ['streak-5', 'Hot on the Trail', 'Solve 5 in a row'],
      ['streak-10', 'Master Detective', 'Solve 10 in a row'],
      ['flawless', 'Not One Slip', 'Finish a case with no wrong moves'],
      ['two-step', 'Two-Stepper', 'Win a Detective case'],
      ['mastermind', 'Mastermind', 'Win a Mastermind case'],
      ['solved-25', 'Twenty-Five Mysteries', 'Free x 25 times'],
      ['solved-100', 'X-Pert', 'Free x 100 times'],
      ['score-500', 'Rising Detective', 'Score 500 in one case']
    ];

    const LEVEL_NAMES = { easy: '🔍 Apprentice', medium: '⚖️ Detective', hard: '🧠 Mastermind' };

    function loadStats() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    }

    function render(stats) {
      const s = stats || {};
      const solved = s.puzzlesSolved || 0;
      const wrong = s.wrongMoves || 0;

      document.getElementById('solved').textContent = solved;
      document.getElementById('high-score').textContent = s.highScore || 0;
      document.getElementById('best-streak').textContent = s.bestStreak || 0;
      document.getElementById('perfect').textContent = s.perfectPuzzles || 0;

      // Roughly two productive moves per solved equation.
      const productive = solved * 2;
      const total = productive + wrong;
      const pct = total ? Math.round((productive / total) * 100) : 0;
      const fill = document.getElementById('accuracy-fill');
      fill.style.width = pct + '%';
      fill.textContent = pct + '%';

      const byLevel = s.gamesByDifficulty || {};
      document.getElementById('levels').innerHTML = ['easy', 'medium', 'hard'].map(function (k) {
        const d = byLevel[k] || { played: 0, won: 0 };
        return '<div class="level"><span>' + LEVEL_NAMES[k] + '</span>' +
               '<span class="n">' + d.won + ' / ' + d.played + ' won</span></div>';
      }).join('');

      const unlocked = {};
      (s.achievements || []).forEach(function (a) { if (a.unlockedAt) unlocked[a.id] = true; });

      document.getElementById('badges').innerHTML = ALL_BADGES.map(function (b) {
        const id = b[0], name = b[1], desc = b[2];
        const got = !!unlocked[id];
        return '<div class="badge' + (got ? '' : ' locked') + '">' +
               '<span class="icon">' + (got ? (BADGE_ICONS[id] || '🏅') : '🔒') + '</span>' +
               '<span><span class="name">' + name + '</span>' +
               '<span class="desc">' + desc + '</span></span></div>';
      }).join('');

      if (!stats) {
        document.getElementById('badges').insertAdjacentHTML('afterbegin',
          '<p class="empty">Play a case to start filling this in!</p>');
      }
    }

    render(loadStats());
  </script>
  <script type="module" src="/src/analytics.ts"></script>
</body>
</html>
